<main id="main" class="library" tabindex="-1">
  <div class="library__inner">
    <div class="empty empty--error">
      <span class="empty__icon"><wz-icon name="alert-circle" size="lg" /></span>
      <h1 class="empty__title">We can't find that class</h1>
      <p class="empty__text">
        It isn't in the class library. Pick another, or build your own ride.
      </p>
      <div class="empty__actions">
        <a class="btn btn--primary" routerLink="/classes"
          ><wz-icon name="arrow-left" size="sm" />All classes</a
        >
        <a class="btn btn--subtle" routerLink="/setup">Build your own ride</a>
      </div>
    </div>
  </div>
</main>

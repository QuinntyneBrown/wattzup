<figure
  class="trace"
  [class.trace--dimmed]="dimmed()"
  [attr.aria-label]="scene()?.title ?? 'Power vs. plan'"
>
  <figcaption class="trace__head">
    <span>{{ scene()?.title ?? 'Power vs. plan' }}</span>
    @if (scene(); as s) {
      <ul class="trace__legend" aria-label="Legend">
        @for (item of s.legend; track item) {
          <li
            [class.is-work]="item === 'Work target' || item === 'Work'"
            [class.is-rest]="item === 'Recover'"
          >
            {{ item }}
          </li>
        }
      </ul>
    }
  </figcaption>
  @if (scene(); as s) {
    <div class="trace__plot" #plot>
      <canvas class="trace__canvas" #canvas aria-hidden="true"></canvas>
      <span class="trace__max">{{ s.maxLabel }}</span>
    </div>
    <div class="trace__axis" aria-hidden="true">
      @for (tick of s.ticks; track tick.label) {
        <span [style.inset-inline-start.%]="tick.percent">{{ tick.label }}</span>
      }
    </div>
    <p class="trace__summary visually-hidden">{{ summary() }}</p>
  } @else {
    <div class="trace__plot">
      <div class="empty empty--compact">
        <p class="empty__title">No ride yet</p>
        <p class="empty__text">
          Your power, drawn against the plan, appears here once a ride starts.
        </p>
      </div>
    </div>
  }
</figure>

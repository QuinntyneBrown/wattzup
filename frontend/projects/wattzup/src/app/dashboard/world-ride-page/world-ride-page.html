@if (phase() === 'not-found') {
  <wz-class-not-found />
} @else if (view(); as v) {
  <wz-world-ride
    [view]="v"
    [clock]="clock()"
    [countdown]="countdown()"
    [classHref]="classHref()"
    (pauseToggled)="togglePause()"
    (endRequested)="end()"
    [musicOn]="musicOn()"
    (musicToggled)="toggleMusic()"
    [soundOn]="rideSound.on()"
    (soundPressed)="dialogs.openRideSound()"
    (stepped)="step($event)"
    [reconnecting]="reconnecting()"
    (navigate)="navigate($event)"
    (sessionOpened)="openSession($event)"
    (reconnected)="reconnect()"
    [sceneUnavailable]="sceneUnavailable()"
  >
    @if (scene(); as sc) {
      <wz-world-scene
        slot="scene"
        [world]="sc.world"
        [segments]="sc.segments"
        [elapsed]="sc.elapsed"
        [speedKmh]="sc.speedKmh"
        [running]="sc.running"
        (unavailable)="sceneUnavailable.set(true)"
      />
    }
  </wz-world-ride>
}

<wz-dialog
  dialogId="end-ride"
  heading="End this ride?"
  [description]="description()"
  icon="stop"
  tone="danger"
  size="sm"
  [busy]="busy()"
>
  <div class="stack">
    @if (failed()) {
      <wz-alert
        tone="danger"
        icon="alert-circle"
        heading="Couldn't end the ride"
        text="The Wattzup server didn't answer. The ride is still running — try again."
      />
    }
    <p class="text-muted text-sm">
      Your power trace and totals stay on the dashboard until you start a new ride.
    </p>
  </div>
  <div dialog-footer class="end-ride__actions">
    <button class="btn" type="button" data-autofocus [disabled]="busy()" (click)="ref.close()">
      Keep riding
    </button>
    <button
      class="btn btn--danger"
      type="button"
      [disabled]="busy()"
      [attr.aria-busy]="busy() ? 'true' : null"
      (click)="end()"
    >
      {{ busy() ? 'Ending…' : failed() ? 'Try again' : 'End ride' }}
    </button>
  </div>
</wz-dialog>

<wz-dialog
  dialogId="replace-ride"
  heading="Replace the ride in progress?"
  [description]="description"
  icon="refresh"
  tone="info"
  size="sm"
  [busy]="busy()"
>
  @if (failed()) {
    <wz-alert
      tone="danger"
      icon="alert-circle"
      heading="Couldn't start the new ride"
      text="The server didn't answer. Your current ride is still running and your new settings are kept."
    />
  }
  <div dialog-footer class="replace-ride__actions">
    <button class="btn" type="button" data-autofocus [disabled]="busy()" (click)="ref.close(false)">
      Keep current ride
    </button>
    <button
      class="btn btn--volt"
      type="button"
      [disabled]="busy()"
      [attr.aria-busy]="busy() ? 'true' : null"
      (click)="replace()"
    >
      {{ busy() ? 'Starting…' : failed() ? 'Try again' : 'Replace ride' }}
    </button>
  </div>
</wz-dialog>

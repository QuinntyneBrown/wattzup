<header class="app-bar">
  <a class="lockup" routerLink="/" aria-label="Wattzup dashboard">
    <svg class="lockup__mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" />
      <path d="M8.5 16 L15.5 34 L23 21 L30.5 34 L39.5 10" />
    </svg>
    <span class="lockup__word">wattzup</span>
  </a>
  <a class="btn btn--quiet btn--sm app-bar__library" routerLink="/classes"
    ><wz-icon name="grid" size="sm" />Library</a
  >
  <span class="app-bar__divider" aria-hidden="true"></span>
  @if (view().view === 'loading') {
    <span class="skeleton skeleton--status" aria-hidden="true"></span>
  } @else {
    <wz-status-line [status]="status()" [reducedMotion]="reducedMotion()" />
  }
  @if (workout(); as w) {
    <a
      class="btn btn--quiet btn--sm app-bar__workout"
      routerLink="/setup"
      [attr.aria-label]="'Edit workout: ' + w.summary"
      ><wz-icon name="sliders" size="sm" />{{ w.summary }}</a
    >
  } @else {
    <a class="btn btn--quiet btn--sm app-bar__workout" routerLink="/setup"
      ><wz-icon name="sliders" size="sm" />Set up a ride</a
    >
  }
  <div class="app-bar__end">
    @if (badge(); as text) {
      <span class="badge badge--warning">{{ text }}</span>
    }
    @if (view().view === 'loading') {
      <span class="skeleton skeleton--clock" aria-hidden="true"></span>
    } @else {
      <wz-ride-clock [elapsed]="countdown.elapsedText()" [total]="total()" />
    }
    @if (paused()) {
      <button
        class="btn"
        type="button"
        [disabled]="!view().pauseEnabled"
        (click)="actions.resume()"
      >
        <wz-icon name="play" size="sm" /><span class="btn__label">Resume</span>
      </button>
    } @else {
      <button class="btn" type="button" [disabled]="!view().pauseEnabled" (click)="actions.pause()">
        <wz-icon name="pause" size="sm" /><span class="btn__label">Pause</span>
      </button>
    }
    <button
      class="btn btn--quiet btn--end"
      type="button"
      [disabled]="!view().endEnabled"
      (click)="actions.end()"
    >
      <wz-icon name="stop" size="sm" /><span class="btn__label">End</span>
    </button>
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      aria-haspopup="dialog"
      [attr.aria-pressed]="sound.on()"
      [attr.aria-label]="sound.on() ? 'Ride sound on' : 'Ride sound off'"
      (click)="dialogs.openRideSound()"
    >
      <wz-icon name="wave" />
    </button>
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      [attr.aria-pressed]="cues.beeps()"
      [attr.aria-label]="cues.beeps() ? 'Countdown beeps on' : 'Countdown beeps off'"
      (click)="cues.toggle()"
    >
      <wz-icon [name]="cues.beeps() ? 'bell' : 'bell-off'" />
    </button>
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      aria-label="Light theme"
      [attr.aria-pressed]="theme.theme() === 'light'"
      (click)="theme.toggle()"
    >
      <wz-icon [name]="theme.theme() === 'light' ? 'moon' : 'sun'" />
    </button>
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      aria-label="Diagnostics"
      (click)="dialogs.openDiagnostics()"
    >
      <wz-icon name="activity" />
    </button>
  </div>
</header>

<div class="dialog__scrim" aria-hidden="true"></div>
<div class="dialog" [attr.aria-busy]="store.saving() ? 'true' : null">
  <div class="dialog__head">
    <h2 class="dialog__title" id="display-name-title">Display name</h2>
    <button
      class="dialog__close"
      type="button"
      aria-label="Close"
      [disabled]="store.saving()"
      (click)="close()"
    >
      <svg class="dialog__close-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
  <div class="dialog__body">
    <wz-display-name-form
      [name]="name"
      action="Save"
      cancel="Cancel"
      [saving]="store.saving()"
      [refusals]="store.refusals()"
      [failed]="store.error() === 'failed'"
      (submitted)="save($event)"
      (cancelled)="close()"
    />
  </div>
</div>

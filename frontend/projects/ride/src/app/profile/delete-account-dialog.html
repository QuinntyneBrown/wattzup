<div class="dialog__scrim" aria-hidden="true"></div>
<div class="dialog" [attr.aria-busy]="store.deleting() ? 'true' : null">
  <div class="dialog__head">
    <h2 class="dialog__title" id="delete-account-title">Delete your account?</h2>
    <button
      class="dialog__close"
      type="button"
      aria-label="Close"
      [disabled]="store.deleting()"
      (click)="close()"
    >
      <svg class="dialog__close-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
  <div class="dialog__body">
    <p class="dialog__lead" id="delete-account-lead">
      This removes your email, display name, progress and ride history, and signs you out
      everywhere. It can’t be undone.
    </p>
    <wz-delete-account-form
      [deleting]="store.deleting()"
      [failed]="store.deleteFailed()"
      (confirmed)="delete()"
      (cancelled)="close()"
    />
  </div>
</div>

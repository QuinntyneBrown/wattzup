<svg class="icon toast__icon" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="10" />
  @if (tone() === 'success') {
    <path d="m9 12 2 2 4-4" />
  } @else {
    <path d="M12 16v-4" />
    <path d="M12 8h.01" />
  }
</svg>
<div class="toast__body">
  <p class="toast__title">{{ title() }}</p>
  <p class="toast__text">
    @if (figure()) {
      <span class="toast__figure">{{ figure() }}</span>
    }
    {{ text() }}
  </p>
</div>
<button class="icon-btn toast__close" type="button" aria-label="Dismiss" (click)="dismissed.emit()">
  <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18 6 6 18" />
    <path d="m6 6 12 12" />
  </svg>
</button>

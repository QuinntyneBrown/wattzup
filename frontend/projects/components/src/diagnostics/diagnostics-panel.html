<div class="diagnostics">
  <div class="diagnostics__header">
    <h2 class="diagnostics__title" id="diagnostics-title">Diagnostics</h2>
    <button
      class="diagnostics__close"
      type="button"
      aria-label="Close diagnostics"
      (click)="dismissed.emit()"
    >
      <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
  <div class="diagnostics__body">
    <dl class="diagnostics__facts">
      @for (fact of facts(); track fact.term) {
        <dt>{{ fact.term }}</dt>
        <dd [attr.data-tone]="fact.tone ?? null">{{ fact.value }}</dd>
      }
    </dl>
    <p class="diagnostics__privacy">
      <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 16h.01" />
        <path
          d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
        />
        <path d="M21.946 12.013H2.054" />
        <path d="M6 16h.01" />
      </svg>
      Everything here is read in your browser and stays on this device until you download it.
    </p>
  </div>
</div>

<div class="mode-options" role="radiogroup" aria-label="Race mode">
  @for (option of options(); track option.id; let index = $index) {
    <button
      class="mode-option"
      type="button"
      role="radio"
      [attr.aria-checked]="option.id === selected()"
      [attr.aria-disabled]="option.disabled ? 'true' : null"
      [tabIndex]="option.id === selected() ? 0 : -1"
      (click)="pick(option)"
      (keydown)="move($event, index)"
    >
      <span class="mode-option__icon">
        @switch (option.icon) {
          @case ('ghost') {
            <svg class="icon icon--lg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 10h.01" />
              <path d="M15 10h.01" />
              <path
                d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"
              />
            </svg>
          }
          @case ('bots') {
            <svg class="icon icon--lg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8V4H8" />
              <rect width="16" height="12" x="4" y="8" rx="2" />
              <path d="M2 14h2" />
              <path d="M20 14h2" />
              <path d="M15 13v2" />
              <path d="M9 13v2" />
            </svg>
          }
          @default {
            <svg class="icon icon--lg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <path d="M16 3.128a4 4 0 0 1 0 7.744" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <circle cx="9" cy="7" r="4" />
            </svg>
          }
        }
      </span>
      <span class="mode-option__text"
        ><span class="mode-option__title">{{ option.title }}</span
        ><span class="mode-option__body">{{ option.body }}</span></span
      >
      @if (option.disabled) {
        <svg class="icon icon--md mode-option__lock" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      }
    </button>
  }
</div>

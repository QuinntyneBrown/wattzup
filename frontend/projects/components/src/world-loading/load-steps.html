<ol class="load-steps" aria-label="Loading steps">
  @for (step of steps(); track step.label) {
    <li
      class="load-step"
      [class.load-step--done]="step.state === 'done'"
      [class.load-step--failed]="step.state === 'failed'"
      [class.load-step--skipped]="step.state === 'skipped'"
      [attr.aria-current]="step.state === 'current' ? 'step' : null"
    >
      <span class="load-step__mark">
        @switch (step.state) {
          @case ('done') {
            <svg class="icon load-step__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          }
          @case ('current') {
            <svg class="icon icon--spin load-step__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
          }
          @case ('failed') {
            <svg class="icon load-step__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          }
          @case ('skipped') {
            <svg class="icon load-step__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          }
          @default {
            <svg class="icon load-step__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="1" />
            </svg>
          }
        }
      </span>
      <span class="load-step__text">
        <span class="load-step__label"
          >{{ step.label }}<span class="visually-hidden">: {{ said[step.state] }}</span></span
        >
        <span class="load-step__detail">{{ step.detail }}</span>
      </span>
    </li>
  }
</ol>

<div class="unlock-card">
  <img class="unlock-card__photo" [src]="view().photoUrl" alt="" />
  <div class="unlock-card__body">
    <p class="unlock-card__title">
      <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 9.9-1" /></svg
      >{{ view().title }}
    </p>
    <p class="unlock-card__place">{{ view().place }}</p>
    <div class="unlock-card__action">
      <ng-content select="[slot=action]" />
    </div>
  </div>
</div>

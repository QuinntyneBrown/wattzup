<ol class="standings" aria-label="Final standings">
  @for (row of rows(); track row.place) {
    <li
      class="standings__row"
      [class.standings__row--you]="row.you"
      [attr.aria-current]="row.you ? 'true' : null"
    >
      <span class="standings__pos">{{ row.place }}</span>
      <span class="standings__dot" [class]="'standings__dot--' + row.jersey"></span>
      <span class="standings__name">{{ row.name }}</span>
      @if (row.bot) {
        <svg class="icon icon--md standings__bot" viewBox="0 0 24 24" role="img" aria-label="Bot">
          <path d="M12 8V4H8" />
          <rect width="16" height="12" x="4" y="8" rx="2" />
          <path d="M2 14h2" />
          <path d="M20 14h2" />
          <path d="M15 13v2" />
          <path d="M9 13v2" />
        </svg>
      }
      <span class="standings__value">{{ row.value }}</span>
    </li>
  }
</ol>

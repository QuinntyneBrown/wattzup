<aside class="setup-aside" aria-label="Ride preview">
  <h2>Your ride</h2>
  <p class="numeral ride-total" [attr.aria-label]="'Total ride time ' + total()">
    {{ total() }}
  </p>
  @if (preview(); as p) {
    <svg
      class="profile"
      [attr.viewBox]="'0 0 ' + p.totalSeconds + ' ' + p.profileHeight"
      preserveAspectRatio="none"
      role="img"
      [attr.aria-label]="p.profileLabel"
    >
      @for (bar of p.profile; track $index) {
        <rect
          [attr.class]="bar.tone"
          [attr.x]="bar.x"
          [attr.width]="bar.width"
          [attr.y]="bar.y"
          [attr.height]="bar.height"
        />
      }
    </svg>
    <div class="profile-axis" aria-hidden="true">
      <span>0:00</span><span>{{ p.total }}</span>
    </div>
    <dl class="summary">
      @for (row of p.rows; track row.term) {
        <div>
          <dt>{{ row.term }}</dt>
          <dd>{{ row.value }}</dd>
        </div>
      }
    </dl>
  }
  <div class="setup-aside__foot">
    <ul class="legend">
      @for (item of preview()?.legend ?? []; track item) {
        <li>
          <span class="swatch" [class]="'swatch--' + item" aria-hidden="true"></span
          >{{ legendLabels[item] }}
        </li>
      }
    </ul>
    <ng-content />
  </div>
</aside>

@let v = view();
<div
  class="level-picker"
  role="slider"
  [attr.id]="fieldId()"
  [attr.aria-label]="labelledBy() ? null : label()"
  [attr.aria-labelledby]="labelledBy()"
  aria-orientation="horizontal"
  [attr.aria-valuemin]="range().min"
  [attr.aria-valuemax]="range().max"
  [attr.aria-valuenow]="value()"
  [attr.aria-valuetext]="text()"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  [attr.tabindex]="disabled() ? -1 : 0"
  (click)="onClick($event)"
  (keydown)="onKey($event)"
>
  @for (l of levels(); track l.level) {
    <span
      class="level-picker__bar"
      aria-hidden="true"
      [class.is-lit]="l.level <= v.litUpTo"
      [class.is-set]="l.level === v.pressedLevel"
      [class.is-plan]="l.level === v.planLevel"
    ></span>
  }
</div>

<div
  class="readout"
  [class.readout--power]="kind() === 'power'"
  [class.readout--cadence]="kind() === 'cadence'"
  [attr.role]="estimate() ? 'group' : null"
  [attr.aria-label]="estimate() ? label() : null"
  [attr.aria-describedby]="estimate() ? descriptionId : null"
>
  <span class="label">{{ label() }}</span>
  <div class="readout__value">
    <span class="numeral">{{ value() }}</span>
    <span class="readout__unit" [attr.title]="estimate()">
      {{ unit() }}
      @if (estimate()) {
        <span class="readout__est">est.</span>
      }
    </span>
  </div>
  <div class="readout__sub"><ng-content /></div>
  @if (estimate(); as text) {
    <span class="visually-hidden" [id]="descriptionId">{{ text }}</span>
  }
</div>

<section class="shelf" [attr.aria-labelledby]="'shelf-' + shelfId()">
  <div class="shelf__head">
    <h2 class="shelf__title" [id]="'shelf-' + shelfId()">{{ title() }}</h2>
    @if (tagline()) {
      <p class="shelf__blurb">{{ tagline() }}</p>
    }
    <span class="shelf__count">{{ count() }}</span>
  </div>
  <ul class="shelf__grid">
    <ng-content />
  </ul>
</section>

<dl class="metrics" [class.metrics--dimmed]="dimmed()">
  @if (metrics(); as list) {
    @for (m of list; track m.term) {
      <div>
        <dt>{{ m.term }}</dt>
        <dd>
          <span class="numeral" [class.is-heart]="m.heart">{{ m.value }}</span><small>{{
            m.unit
          }}</small>
        </dd>
      </div>
    }
  } @else {
    @for (term of terms; track term) {
      <div>
        <dt>{{ term }}</dt>
        <dd><span class="skeleton skeleton--metric" aria-hidden="true"></span></dd>
      </div>
    }
  }
</dl>

<div class="toggles">
  <label class="toggle-row">
    <span><b>Warm-up</b><small>3 min, easy</small></span>
    <span class="switch"
      ><input
        type="checkbox"
        role="switch"
        [checked]="warmup()"
        [disabled]="disabled()"
        (change)="warmup.set($any($event.target).checked)"
    /></span>
  </label>
  <label class="toggle-row">
    <span><b>Cool-down</b><small>2 min, easy</small></span>
    <span class="switch"
      ><input
        type="checkbox"
        role="switch"
        [checked]="cooldown()"
        [disabled]="disabled()"
        (change)="cooldown.set($any($event.target).checked)"
    /></span>
  </label>
</div>

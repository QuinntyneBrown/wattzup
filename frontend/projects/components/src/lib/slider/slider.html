<div
  class="level-slider"
  [class.level-slider--rest]="tone() === 'rest'"
  [class.level-slider--large]="large()"
>
  <div class="level-slider__head">
    <label [for]="fieldId()">{{ label() }}</label>
    <output class="numeral" [for]="fieldId()"
      >{{ level() }}<small>{{ suffix() }}</small></output
    >
  </div>
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [id]="fieldId()"
    [value]="level()"
    [disabled]="disabled()"
    [attr.aria-valuetext]="valueText()"
    (input)="onInput($event)"
  />
  <div class="level-slider__scale" aria-hidden="true">
    <span>{{ scale()[0] }}</span><span>{{ scale()[1] }}</span>
  </div>
</div>

<form class="delete-account-form" novalidate (submit)="submit($event)">
  <div class="field">
    <label class="field__label" for="delete-account-confirm">Type “delete” to confirm</label>
    <input
      class="input input--lg"
      id="delete-account-confirm"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [value]="value()"
      [disabled]="deleting()"
      (input)="onInput($event)"
    />
  </div>
  @if (failed()) {
    <wz-inline-message class="delete-account-form__message" tone="error" role="alert"
      >We couldn’t delete your account. Check your connection and try again.</wz-inline-message
    >
  }
  <div class="delete-account-form__actions">
    <button
      wz-button
      variant="raised"
      type="button"
      [disabled]="deleting()"
      (click)="cancelled.emit()"
    >
      Cancel
    </button>
    <button wz-button variant="danger" type="submit" [disabled]="!ready() || deleting()">
      @if (deleting()) {
        <svg class="delete-account-form__spinner" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        Deleting…
      } @else {
        Delete my account
      }
    </button>
  </div>
</form>

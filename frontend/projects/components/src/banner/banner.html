@switch (tone()) {
  @case ('danger') {
    <svg class="icon banner__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </svg>
  }
  @case ('info') {
    <svg class="icon banner__icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </svg>
  }
  @case ('warning') {
    <svg class="icon banner__icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 6v6l4 2" />
    </svg>
  }
  @default {
    <svg class="icon banner__icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 9.9-1" />
    </svg>
  }
}
<p class="banner__body">
  <span class="banner__title"
    ><ng-content select="[slot=title]">{{ title() }}</ng-content></span
  >
  @if (detail()) {
    &ngsp;<span class="banner__detail">{{ detail() }}</span>
  }
</p>
<ng-content select="[slot=action]" />

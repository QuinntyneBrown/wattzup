# Telo Ride's pipeline (L2-149 AC3, ADR 0026). On every push and pull request it runs lint, the production
# builds and one critical acceptance path per feature, in three parallel jobs, and fails on any of them. It
# runs no unit tests and no visual, responsive, accessibility or heap sweep: `node tools/verify/verify.mjs`
# runs everything locally. No job touches Bluetooth hardware, a real backend or a database: the Playwright
# specs answer them from fixtures and the backend tests run on EF Core InMemory (AGENTS.md).
#
# Kept under 5 minutes: the checkout leaves out docs/ (the films), node_modules, NuGet packages and the
# Playwright browser are cached, and nothing is retried. A push to main that passes is deployed, once the
# repository variables of docs/deployment.md name the host.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
      - name: Prettier
        run: npm run format:check
        working-directory: frontend
      - name: ESLint and the e2e type check
        run: npm run lint
        working-directory: frontend
      - name: dotnet format
        run: dotnet format Telo.Ride.slnx --verify-no-changes
        working-directory: backend

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
      - name: The ride app, within its budgets
        run: npm run build
        working-directory: frontend
      - name: The ride app's initial bundle, at most 300 KB gzipped
        run: npm run bundle:size
        working-directory: frontend
      - name: The marketing site, within its budgets
        run: npm run build:marketing
        working-directory: frontend
      - name: The API, warnings as errors
        run: dotnet build Telo.Ride.slnx -c Release
        working-directory: backend

  acceptance:
    name: Critical acceptance paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      # The runner image already carries Chromium's system libraries, so only the browser is fetched,
      # and only when it is not cached.
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: frontend
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
      - name: Playwright specs tagged @critical (Chromium)
        run: npx playwright test --grep @critical
        working-directory: frontend
      - name: Backend acceptance tests marked Critical
        run: dotnet test --solution Telo.Ride.slnx --filter-trait "Category=Critical"
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # A push to main that passes is published to the App Service, which serves the app and its backend
  # as one origin (ADR 0026). The job signs in with GitHub's OIDC token (no stored credential), migrates
  # the database with the new build, and only then deploys it, so the new version starts on a migrated
  # schema. Skipped until TELO_RIDE_WEBAPP names the host (docs/deployment.md).
  deploy:
    name: Deploy
    needs: [lint, build, acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TELO_RIDE_WEBAPP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Build the app
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - name: Publish the API with the app in its wwwroot
        run: |
          dotnet publish backend/src/Telo.Ride.Api -c Release -o out
          cp -R frontend/dist/ride/browser out/wwwroot
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate the database before the new version starts
        run: dotnet out/Telo.Ride.Api.dll migrate
        env:
          ConnectionStrings__TeloRide: ${{ secrets.TELO_RIDE_DATABASE }}
      - name: Deploy to the App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.TELO_RIDE_WEBAPP }}
          resource-group-name: ${{ vars.TELO_RIDE_RESOURCE_GROUP }}
          package: out

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display name prompt · default — Telo Ride mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="sign-in-name">
<meta name="mock:state" content="default">
<meta name="mock:requirements" content="L2-005">
<meta name="description" content="Straight after a new account’s code is confirmed: one field, the rule under it, and Continue disabled until a name is typed (L2-005 AC1).">
<link rel="stylesheet" href="../../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../../design-system/assets/components.css">
<link rel="stylesheet" href="../../assets/mock.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="sign-in">
  <div class="sign-in__panel">
    <span class="sign-in__brand"><span class="lockup" role="img" aria-label="Telo Ride"><svg class="logo-mark" width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><path class="logo-mark__ring" d="M37.79 21.57 A14 14 0 1 1 26.43 10.21"/><path class="logo-mark__crank" d="M24 24 L38 10"/><circle class="logo-mark__hub" cx="24" cy="24" r="4.6"/></svg><span class="wordmark">TELO<span class="wordmark__product">Ride</span></span></span></span>
    <h1 class="sign-in__title">What should other riders call you?</h1>
    <p class="sign-in__lead">Other riders see this name on start grids and boards, never your email.</p>
      <form class="display-name-form sign-in__form" novalidate>
        <div class="field">
          <label class="field__label" for="display-name">Display name</label>
          <input class="input input--lg" id="display-name" type="text" autocomplete="nickname" spellcheck="false" aria-describedby="display-name-hint">
          <p class="field__hint" id="display-name-hint">2 to 24 characters: letters, digits, spaces, . _ and -</p>
        </div>
        <div class="display-name-form__actions"><button class="btn btn--primary btn--lg btn--block" type="submit" disabled>Continue</button></div>
      </form>
  </div>
</main>

<nav class="mock-bar" aria-label="Mock navigation">
  <a class="mock-bar__home" href="../../index.html" aria-label="All mocks">⌂</a>

  </ul>
  <button type="button" data-theme-toggle aria-pressed="true">☀ Light</button>
  <button type="button" data-chrome-toggle aria-label="Hide mock chrome">×</button>
</nav>
<script src="../../assets/mock.js"></script>
</body>
</html>

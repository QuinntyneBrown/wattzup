<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · default — Telo Ride mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="sign-in">
<meta name="mock:state" content="default">
<meta name="mock:requirements" content="L2-001 L2-003">
<meta name="description" content="The sign-in screen: one email field and “Send my code”. New and returning riders see the same screen (L2-001).">
<link rel="stylesheet" href="../../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../../design-system/assets/components.css">
<link rel="stylesheet" href="../../assets/mock.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="sign-in">
  <div class="sign-in__panel">
    <span class="sign-in__brand"><span class="lockup" role="img" aria-label="Telo Ride"><svg class="logo-mark" width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><path class="logo-mark__ring" d="M37.79 21.57 A14 14 0 1 1 26.43 10.21"/><path class="logo-mark__crank" d="M24 24 L38 10"/><circle class="logo-mark__hub" cx="24" cy="24" r="4.6"/></svg><span class="wordmark">TELO<span class="wordmark__product">Ride</span></span></span></span>
    <h1 class="sign-in__title">Sign in to Telo Ride</h1>
    <p class="sign-in__lead">Enter your email and we’ll send you a six-digit code. No password, ever.</p>
    <form class="sign-in__form" action="../sign-in-code/default.html" novalidate>
      <div class="field">
        <label class="field__label" for="sign-in-email">Email</label>
        <input class="input input--lg" id="sign-in-email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="name@example.com">
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Send my code</button>
    </form>
    <p class="sign-in__note">New here? The same code makes your account.</p>
  </div>
</main>

  <a class="mock-bar__home" href="../../index.html" aria-label="All mocks">⌂</a>

    <li><a href="rate-limited.html">rate-limited</a></li>
    <li><a href="account-deleted.html">account-deleted</a></li>
  </ul>
  <button type="button" data-theme-toggle aria-pressed="true">☀ Light</button>
  <button type="button" data-chrome-toggle aria-label="Hide mock chrome">×</button>
</nav>
<script src="../../assets/mock.js"></script>
</body>
</html>
